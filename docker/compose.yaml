x-application: &application
  image: local-context-manager:0.2.0
  pull_policy: never
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 5s
  tmpfs: ["/tmp:rw,nosuid,size=256m"]
  environment:
    CONTEXT_MANAGER_HOME: /data
    CONTEXT_MANAGER_BRIDGE: /bridge
    TIKTOKEN_CACHE_DIR: /token-cache
  volumes:
    - manager-data:/data
    - ${MANAGER_BRIDGE:?Set MANAGER_BRIDGE}:/bridge
    - ${TOKEN_CACHE:?Set TOKEN_CACHE}:/token-cache:ro
    - ${CONTEXT_EXTENSIONS:?Set CONTEXT_EXTENSIONS}:/extensions:ro
services:
  api:
    <<: *application
    command: [api, --bind, 0.0.0.0]
    networks: [internal]
  worker:
    <<: *application
    command: [worker]
    network_mode: none
  reader:
    <<: *application
    command: [reader, --bind, 0.0.0.0]
    networks: [internal]
    volumes:
      - manager-data:/data:ro
      - ${MANAGER_BRIDGE:?Set MANAGER_BRIDGE}:/bridge
      - ${TOKEN_CACHE:?Set TOKEN_CACHE}:/token-cache:ro
      - ${CONTEXT_EXTENSIONS:?Set CONTEXT_EXTENSIONS}:/extensions:ro
  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine
    pull_policy: never
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    tmpfs: ["/tmp:rw,nosuid,size=64m"]
    ports: ["127.0.0.1:8791:8791", "127.0.0.1:8792:8792"]
    volumes: ["${MANAGER_SOURCE:?Set MANAGER_SOURCE}/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [internal, ingress]
    depends_on: [api, reader]
networks:
  internal: {internal: true}
  ingress: {}
volumes:
  manager-data:
    external: true
    name: ${MANAGER_VOLUME:?Set MANAGER_VOLUME}
